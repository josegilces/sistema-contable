<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema Contable · Ciclo de 3 Fases</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <meta name="theme-color" content="#1e3a6e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sistema Contable" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            navy: {
              950: "#07122b",
              900: "#0b1733",
              800: "#13264d",
              700: "#1e3a6e"
            }
          }
        }
      }
    };
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="h-screen overflow-hidden">
  <div class="flex h-full">
    <aside class="sidebar w-72 shrink-0 text-white flex flex-col">
      <div class="px-5 pt-6 pb-4">
        <div class="text-[11px] uppercase tracking-[0.18em] text-indigo-200/80">Contabilidad local</div>
        <h1 class="mt-1 text-lg font-semibold leading-tight">Sistema Contable</h1>
        <p class="mt-1 text-xs text-slate-300">Ciclo estricto de 3 fases</p>
      </div>
      <nav id="nav" class="flex-1 overflow-y-auto px-3 pb-6 space-y-4"></nav>
      <div class="px-4 py-4 text-[11px] text-slate-400 border-t border-white/10">
        Persistencia automática en este navegador
      </div>
    </aside>

    <main class="main flex-1 min-w-0 flex flex-col">
      <header class="no-print bg-white/90 backdrop-blur border-b border-slate-200 px-6 py-3 flex items-center gap-4">
        <div class="flex-1 min-w-0">
          <div class="text-xs text-slate-500">Empresa</div>
          <input id="empresa" class="input w-full max-w-md py-1 px-2" />
        </div>
        <div class="field w-40">
          <label for="periodo">Periodo</label>
          <input id="periodo" class="input py-1" placeholder="2026" />
        </div>
        <div class="flex items-center gap-2">
          <button id="btnInstallApp" class="btn btn-ok no-print hidden" type="button">📲 Instalar App</button>
          <button id="btnCasoPrueba" class="btn btn-primary no-print" type="button">Cargar Caso de Prueba</button>
          <button id="btnTutorial" class="btn btn-ghost no-print" type="button">Ver tutorial</button>
          <button id="btnReset" class="btn btn-danger no-print">Restablecer</button>
        </div>
      </header>
      <section id="view" data-view-host="balance-general" class="flex-1 overflow-y-auto p-6"></section>
    </main>
  </div>
  <div id="toast" class="toast hidden"></div>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('Service Worker registrado:', reg.scope))
          .catch(err => console.error('Error al registrar Service Worker:', err));
      });
    }

    let deferredPrompt;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      const btnInstall = document.getElementById('btnInstallApp');
      if (btnInstall) {
        btnInstall.classList.remove('hidden');
        btnInstall.onclick = () => {
          btnInstall.classList.add('hidden');
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then(() => {
            deferredPrompt = null;
          });
        };
      }
    });
  </script>
</body>
</html>
